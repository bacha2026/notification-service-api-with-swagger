user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65s;

    map $http_x_correlation_id $nsa_correlation_id {
        default $http_x_correlation_id;
        "" $request_id;
    }

    # Generated atomically by deploy.sh/rollback.sh. This defines the active
    # release labels plus nsa_active_web and nsa_static_assets upstreams.
    include /etc/nginx/release/upstream-active.conf;

    log_format release_json escape=json
        '{"time":"$time_iso8601","request_id":"$nsa_correlation_id",'
        '"status":$status,"method":"$request_method","uri":"$uri",'
        '"release_color":"$nsa_release_color","release_sha":"$nsa_release_sha",'
        '"upstream":"$upstream_addr","upstream_time":"$upstream_response_time",'
        '"request_time":$request_time}';
    access_log /var/log/nginx/access.log release_json;

    server {
        listen 8080;
        server_name _;

        add_header X-Release-Color $nsa_release_color always;
        add_header X-Release-Sha $nsa_release_sha always;
        add_header X-Correlation-ID $nsa_correlation_id always;
        add_header X-Content-Type-Options nosniff always;

        location = /edge/health {
            access_log off;
            default_type application/json;
            return 200 '{"service":"nginx","status":"healthy"}\n';
        }

        # During the rollback window, versioned chunks missing from the new
        # color are retried against the former color so in-flight browsers can
        # finish loading the release that produced their HTML.
        location /_next/static/ {
            proxy_pass http://nsa_static_assets;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $nsa_correlation_id;
            proxy_next_upstream error timeout invalid_header http_404 http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            add_header X-Release-Color $nsa_release_color always;
            add_header X-Release-Sha $nsa_release_sha always;
            add_header X-Correlation-ID $nsa_correlation_id always;
            add_header X-Content-Type-Options nosniff always;
        }

        location / {
            proxy_pass http://nsa_active_web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $nsa_correlation_id;
            proxy_hide_header X-Release-Color;
            proxy_hide_header X-Release-Sha;
            proxy_connect_timeout 3s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
        }
    }
}
