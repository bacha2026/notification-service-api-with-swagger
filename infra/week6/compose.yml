name: nsa-week6

x-api-service: &api-service
  restart: unless-stopped
  networks:
    - backend
  secrets:
    - source: app_db_connection
      target: ConnectionStrings__NotificationDb
    - source: jwt_signing_key
      target: Authentication__Jwt__SigningKey
  healthcheck:
    test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:8080/health/ready >/dev/null"]
    interval: 5s
    timeout: 5s
    retries: 18
    start_period: 10s

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: http://+:8080
  HttpsRedirection__Enabled: "false"
  Database__ApplyMigrationsOnStartup: "false"
  ReverseProxy__TrustForwardedHeaders: "true"
  Cors__AllowedOrigins__0: http://127.0.0.1:8088
  Cors__AllowedOrigins__1: http://localhost:8088

x-next-service: &next-service
  restart: unless-stopped
  networks:
    - backend
    - edge
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/version').then(async r=>{const b=await r.json();process.exit(r.ok&&b.service==='next'?0:1)}).catch(()=>process.exit(1))"]
    interval: 5s
    timeout: 5s
    retries: 18
    start_period: 10s

services:
  # The migrator is an explicit one-shot release step. It is never started by
  # an API container, preventing blue and green from racing for schema owner.
  migrator:
    image: "${MIGRATOR_IMAGE:?Run deploy.sh with an immutable release manifest first}"
    environment:
      DOTNET_ENVIRONMENT: Production
    secrets:
      - source: migrator_db_connection
        target: ConnectionStrings__NotificationDb
    networks:
      - backend
    restart: "no"

  api-blue:
    <<: *api-service
    image: "${BLUE_API_IMAGE:?Missing BLUE_API_IMAGE in the generated release environment}"
    environment:
      <<: *api-environment
      Release__Color: blue
      Release__Sha: "${BLUE_RELEASE_SHA:?Missing BLUE_RELEASE_SHA}"

  next-blue:
    <<: *next-service
    image: "${BLUE_NEXT_IMAGE:?Missing BLUE_NEXT_IMAGE in the generated release environment}"
    environment:
      NODE_ENV: production
      NOTIFICATION_API_URL: http://api-blue:8080
      RELEASE_COLOR: blue
      RELEASE_ID: "${BLUE_RELEASE_SHA:?Missing BLUE_RELEASE_SHA}"

  api-green:
    <<: *api-service
    image: "${GREEN_API_IMAGE:?Missing GREEN_API_IMAGE in the generated release environment}"
    environment:
      <<: *api-environment
      Release__Color: green
      Release__Sha: "${GREEN_RELEASE_SHA:?Missing GREEN_RELEASE_SHA}"

  next-green:
    <<: *next-service
    image: "${GREEN_NEXT_IMAGE:?Missing GREEN_NEXT_IMAGE in the generated release environment}"
    environment:
      NODE_ENV: production
      NOTIFICATION_API_URL: http://api-green:8080
      RELEASE_COLOR: green
      RELEASE_ID: "${GREEN_RELEASE_SHA:?Missing GREEN_RELEASE_SHA}"

  nginx:
    image: nginx:1.28.0-alpine-slim@sha256:ce2bd4775ed6859d35f47d65401ee9f35f1dd00b32ed05f0ce38b68aa1830195
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.runtime/nginx:/etc/nginx/release:ro
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --output-document=/dev/null http://127.0.0.1:8080/health/version || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

secrets:
  app_db_connection:
    file: ../week5/.runtime/secrets/api/app_db_connection
  migrator_db_connection:
    file: ../week5/.runtime/secrets/migrator/migrator_db_connection
  jwt_signing_key:
    file: ../week5/.runtime/secrets/api/jwt_signing_key

networks:
  backend:
    external: true
    name: nsa-week5-backend
  edge:
    external: true
    name: nsa-week5-edge
