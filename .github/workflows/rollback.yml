name: Roll back immutable release

on:
  workflow_dispatch:
    inputs:
      publish_run_id:
        description: Publish run ID that holds the exact prior manifest.
        required: true
        type: string
      release_revision:
        description: Exact prior commit SHA expected in deployment state.
        required: true
        type: string

permissions:
  actions: read
  attestations: read
  contents: read
  packages: read

concurrency:
  group: promotion-production-like
  cancel-in-progress: false

jobs:
  rollback:
    name: Verify prior color and switch back
    uses: ./.github/workflows/deploy-release.yml
    with:
      operation: rollback
      publish_run_id: ${{ inputs.publish_run_id }}
      release_revision: ${{ inputs.release_revision }}
      timeout_minutes: 20
