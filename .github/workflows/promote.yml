name: Promote immutable release

on:
  workflow_dispatch:
    inputs:
      publish_run_id:
        description: Workflow run ID that produced the attested release manifest.
        required: true
        type: string
      release_revision:
        description: Exact 40-character commit SHA recorded by that manifest.
        required: true
        type: string
      observe_seconds:
        description: Post-cutover observation window (0-120 seconds).
        required: true
        default: "10"
        type: string

permissions:
  actions: read
  attestations: read
  contents: read
  packages: read

concurrency:
  group: promotion-production-like
  cancel-in-progress: false

jobs:
  promote:
    name: Gate idle color and switch
    uses: ./.github/workflows/deploy-release.yml
    with:
      operation: promotion
      publish_run_id: ${{ inputs.publish_run_id }}
      release_revision: ${{ inputs.release_revision }}
      observe_seconds: ${{ inputs.observe_seconds }}
      timeout_minutes: 30
