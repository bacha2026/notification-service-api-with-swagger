name: Build, test, and publish

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  REGISTRY: ghcr.io

jobs:
  test:
    name: Build and test
    uses: ./.github/workflows/quality-gates.yml

  publish-dotnet:
    name: Publish .NET artifact (${{ matrix.component }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            project: notification-api/NSA.csproj
          - component: worker
            project: notification.worker/NSA.Worker.csproj
          - component: outbox-worker
            project: notification.outbox.worker/NSA.Outbox.Worker.csproj
          - component: migrator
            project: notification-api/NSA.csproj
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Publish project
        run: >-
          dotnet publish "${{ matrix.project }}"
          --configuration Release
          --output "artifacts/publish/${{ matrix.component }}"
          /p:UseAppHost=false

      - name: Archive and upload
        run: |
          mkdir -p artifacts
          tar -czf "artifacts/${{ matrix.component }}-${GITHUB_SHA}.tar.gz" \
            -C "artifacts/publish/${{ matrix.component }}" .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.component }}-${{ github.sha }}
          path: artifacts/${{ matrix.component }}-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish-web:
    name: Publish web artifacts
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            next/package-lock.json
            angular/package-lock.json

      - name: Build and archive Next.js
        env:
          RELEASE_ID: ${{ github.sha }}
        run: |
          npm ci --prefix next
          npm --prefix next run build
          mkdir -p artifacts/next/.next/static
          cp -R next/.next/standalone/. artifacts/next/
          cp -R next/.next/static/. artifacts/next/.next/static/
          if [ -d next/public ]; then
            mkdir -p artifacts/next/public
            cp -R next/public/. artifacts/next/public/
          fi
          tar -czf "artifacts/next-${GITHUB_SHA}.tar.gz" -C artifacts/next .

      - name: Build and archive Angular
        run: |
          npm ci --prefix angular
          npm --prefix angular run build
          tar -czf "artifacts/angular-${GITHUB_SHA}.tar.gz" -C angular/dist .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-${{ github.sha }}
          path: artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish-images:
    name: Publish container (${{ matrix.component }})
    needs: [test, publish-dotnet, publish-web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            image: notification-api
            context: .
            dockerfile: ./notification-api/Dockerfile
            target: final
          - component: worker
            image: notification-worker
            context: .
            dockerfile: ./notification.worker/Dockerfile
            target: final
          - component: outbox-worker
            image: notification-outbox-worker
            context: .
            dockerfile: ./notification.outbox.worker/Dockerfile
            target: final
          - component: migrator
            image: notification-migrator
            context: .
            dockerfile: ./notification-api/Dockerfile
            target: migrator
          - component: next
            image: notification-web
            context: ./next
            dockerfile: ./next/Dockerfile
            target: runner
            build_args: RELEASE_ID=${{ github.sha }}
          - component: angular
            image: notification-angular
            context: ./angular
            dockerfile: ./angular/Dockerfile
            target: runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve lowercase image name
        id: image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
        run: echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=sha,format=long,prefix=sha-
            type=semver,pattern={{version}},value=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build_args }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
