name: Quality gates

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore, build, and test
        run: |
          dotnet restore notification-api/NSA.sln
          dotnet build notification-api/NSA.sln --configuration Release --no-restore
          dotnet test notification-api/NSA.sln --configuration Release --no-build \
            --logger "trx;LogFileName=tests.trx" \
            --results-directory artifacts/test-results/dotnet

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dotnet-test-results-${{ github.run_id }}
          path: artifacts/test-results/dotnet
          if-no-files-found: warn
          retention-days: 14

  next:
    name: Next.js checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: next/package-lock.json

      - name: Install, lint, test, and build
        env:
          RELEASE_ID: ${{ github.sha }}
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Test production rendering
        env:
          RELEASE_ID: ${{ github.sha }}
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: next-test-results-${{ github.run_id }}
          path: |
            next/coverage
            next/playwright-report
            next/test-results
          if-no-files-found: ignore
          retention-days: 14

  angular:
    name: Angular tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: angular
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: angular/package-lock.json

      - name: Install, test, and build
        run: |
          npm ci
          npm test -- --watch=false
          npm run build

  infrastructure:
    name: Infrastructure checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Check shell syntax and release-control tests
        run: |
          bash -n infra/week5/*.sh infra/week5/sqlserver/*.sh infra/week6/*.sh
          node --test infra/week6/tests/*.test.mjs

      - name: Validate Compose files
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          mkdir -p infra/week5/.runtime/secrets/platform \
            infra/week5/.runtime/secrets/api \
            infra/week5/.runtime/secrets/worker \
            infra/week5/.runtime/secrets/migrator
          for file in sql_sa_password sql_app_password sql_migrator_password rabbitmq.conf; do
            printf 'ci-placeholder' > "infra/week5/.runtime/secrets/platform/$file"
          done
          printf 'ci-placeholder' > infra/week5/.runtime/secrets/api/app_db_connection
          printf 'ci-placeholder' > infra/week5/.runtime/secrets/api/jwt_signing_key
          printf 'ci-placeholder' > infra/week5/.runtime/secrets/worker/app_db_connection
          printf 'ci-placeholder' > infra/week5/.runtime/secrets/worker/rabbitmq_username
          printf 'ci-placeholder' > infra/week5/.runtime/secrets/worker/rabbitmq_password
          printf 'ci-placeholder' > infra/week5/.runtime/secrets/migrator/migrator_db_connection
          docker compose --file infra/week5/compose.vault.yml config --quiet
          docker compose --file infra/week5/compose.yml config --quiet

          mkdir -p infra/week6/.runtime/nginx
          digest="sha256:$(printf '1%.0s' {1..64})"
          {
            printf 'BLUE_API_IMAGE=%s\n' "$digest"
            printf 'BLUE_NEXT_IMAGE=%s\n' "$digest"
            printf 'BLUE_RELEASE_SHA=%s\n' "$GITHUB_SHA"
            printf 'GREEN_API_IMAGE=%s\n' "$digest"
            printf 'GREEN_NEXT_IMAGE=%s\n' "$digest"
            printf 'GREEN_RELEASE_SHA=%s\n' "$GITHUB_SHA"
            printf 'MIGRATOR_IMAGE=%s\n' "$digest"
          } > infra/week6/.runtime/release.env
          docker compose --env-file infra/week6/.runtime/release.env \
            --file infra/week6/compose.yml config --quiet
