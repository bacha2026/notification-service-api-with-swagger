services:
  outbox-relay:
    build:
      context: ..
      dockerfile: notification.outbox.worker/Dockerfile
    environment:
      ConnectionStrings__NotificationDb: >-
        Server=sqlserver,1433;Database=NotificationServiceDb;User Id=sa;Password=${WEEK3_SQL_PASSWORD:?Set WEEK3_SQL_PASSWORD in .env first};Encrypt=False;TrustServerCertificate=True;MultipleActiveResultSets=true;Connect Timeout=2;ConnectRetryCount=0
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: "${WEEK3_RABBITMQ_USERNAME:?Set WEEK3_RABBITMQ_USERNAME in .env first}"
      RabbitMq__Password: "${WEEK3_RABBITMQ_PASSWORD:?Set WEEK3_RABBITMQ_PASSWORD in .env first}"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - week3
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/nsa-outbox-worker-ready -mmin -0.25 -print 2>/dev/null | grep -q ."]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
